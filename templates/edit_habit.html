<!-- templates/edit_habit.html -->
{% extends "base.html" %}

{% block content %}
<div class="container-fluid px-4 fade-in">
    <div class="row mb-4">
        <div class="col">
            <h1 class="h3 mb-0 text-gray-800">Edit Habit</h1>
            <p class="mb-4">Update your habit details.</p>
        </div>
    </div>
    
    <div class="row">
        <div class="col-lg-8">
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold">Habit Details</h6>
                </div>
                <div class="card-body">
                    <form action="{{ url_for('edit_habit', id=habit[0]) }}" method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label">Habit Name</label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ habit[1] }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="goal_id" class="form-label">Related Goal (Optional)</label>
                            <select class="form-select" id="goal_id" name="goal_id">
                                <option value="">None</option>
                                {% for goal in goals %}
                                    <option value="{{ goal[0] }}" {% if habit[2] == goal[0] %}selected{% endif %}>{{ goal[2] }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label for="frequency" class="form-label">Frequency</label>
                            <select class="form-select" id="frequency" name="frequency" required>
                                <option value="daily" {% if habit[3] == 'daily' %}selected{% endif %}>Daily</option>
                                <option value="weekdays" {% if habit[3] == 'weekdays' %}selected{% endif %}>Weekdays Only</option>
                                <option value="weekends" {% if habit[3] == 'weekends' %}selected{% endif %}>Weekends Only</option>
                                <option value="weekly" {% if habit[3] == 'weekly' %}selected{% endif %}>Weekly</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label for="streak" class="form-label">Current Streak</label>
                            <input type="number" class="form-control" id="streak" name="streak" value="{{ habit[4]|int }}" min="0" required>
                            <div class="form-text">Current streak in days. Only modify if you need to correct the streak count.</div>
                        </div>
                        
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="{{ url_for('view_habits') }}" class="btn btn-secondary me-md-2">Cancel</a>
                            <button type="submit" class="btn btn-primary">Update Habit</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        
        <div class="col-lg-4">
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold">Habit History</h6>
                </div>
                <div class="card-body">
                    <p>Current streak: <strong>{{ habit[4]|int }} days</strong></p>
                    <p>Created on: {{ habit[5] }}</p>
                    
                    <hr>
                    
                    <div class="d-grid gap-2">
                        <form action="{{ url_for('delete_habit', id=habit[0]) }}" method="post" onsubmit="return confirm('Are you sure you want to delete this habit? This action cannot be undone.');">
                            <button type="submit" class="btn btn-danger btn-sm">
                                <i class="fas fa-trash"></i> Delete Habit
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
