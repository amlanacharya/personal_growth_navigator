<!-- templates/edit_goal.html -->
{% extends "base.html" %}

{% block content %}
<div class="container-fluid px-4">
    <div class="row mb-4">
        <div class="col">
            <h1 class="h3 mb-0 text-gray-800">Edit Goal</h1>
            <p class="mb-4">Update your goal details and track your progress.</p>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-8">
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold">Goal Details</h6>
                </div>
                <div class="card-body">
                    <form method="post" action="{{ url_for('edit_goal', id=goal[0]) }}">
                        <div class="mb-3">
                            <label for="category" class="form-label">Category</label>
                            <select class="form-select" id="category" name="category" required>
                                <option value="Physical Fitness" {% if goal[1] == 'Physical Fitness' %}selected{% endif %}>Physical Fitness</option>
                                <option value="Mental Wellbeing" {% if goal[1] == 'Mental Wellbeing' %}selected{% endif %}>Mental Wellbeing</option>
                                <option value="Professional Development" {% if goal[1] == 'Professional Development' %}selected{% endif %}>Professional Development</option>
                                <option value="Personal Relationships" {% if goal[1] == 'Personal Relationships' %}selected{% endif %}>Personal Relationships</option>
                                <option value="Financial" {% if goal[1] == 'Financial' %}selected{% endif %}>Financial</option>
                                <option value="Spiritual" {% if goal[1] == 'Spiritual' %}selected{% endif %}>Spiritual</option>
                                <option value="Hobbies" {% if goal[1] == 'Hobbies' %}selected{% endif %}>Hobbies</option>
                                <option value="Other" {% if goal[1] == 'Other' %}selected{% endif %}>Other</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="3" required>{{ goal[2] }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label for="deadline" class="form-label">Deadline (optional)</label>
                            <input type="date" class="form-control" id="deadline" name="deadline" value="{{ goal[3] }}">
                        </div>
                        <div class="mb-3">
                            <label for="priority" class="form-label">Priority (1 is highest)</label>
                            <select class="form-select" id="priority" name="priority" required>
                                <option value="1" {% if goal[4] == 1 %}selected{% endif %}>1 - Highest</option>
                                <option value="2" {% if goal[4] == 2 %}selected{% endif %}>2 - High</option>
                                <option value="3" {% if goal[4] == 3 %}selected{% endif %}>3 - Medium</option>
                                <option value="4" {% if goal[4] == 4 %}selected{% endif %}>4 - Low</option>
                                <option value="5" {% if goal[4] == 5 %}selected{% endif %}>5 - Lowest</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-select" id="status" name="status" required>
                                <option value="active" {% if goal[5] == 'active' %}selected{% endif %}>Active</option>
                                <option value="completed" {% if goal[5] == 'completed' %}selected{% endif %}>Completed</option>
                                <option value="abandoned" {% if goal[5] == 'abandoned' %}selected{% endif %}>Abandoned</option>
                            </select>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('view_goals') }}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Update Goal</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold">Related Habits</h6>
                </div>
                <div class="card-body">
                    <div class="d-grid gap-2">
                        <a href="{{ url_for('add_habit') }}" class="btn btn-outline-primary">Add Related Habit</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
